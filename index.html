  <canvas id="game" aria-label="Gnome, Line &amp; Sinker"></canvas>

  <!-- start menu -->
  <div id="menu" class="menu">
    <div class="menu-panel">
      <div class="logo"><img id="menuGnome" alt=""><div><h1>Gnome, Line<br><em>&amp; Sinker</em></h1><p data-t="tagline">Incremental memancing</p></div></div>
      <div class="slot" id="menuSlot"></div>
      <div class="menu-global hidden" id="menuGlobal" aria-live="polite"></div>
      <div class="menu-btns">
        <button class="btn btn-primary" id="menuPlay"><svg class="ic"><use href="#i-play"/></svg><span id="menuPlayLabel">Lanjutkan</span></button>
        <button class="btn" id="menuNew"><svg class="ic"><use href="#i-plus"/></svg><span data-t="menuNew">Main baru</span></button>
        <div class="row2">
          <button class="btn" id="menuImport"><svg class="ic"><use href="#i-upload"/></svg><span data-t="menuImport">Muat file</span></button>
          <button class="btn" id="menuExport"><svg class="ic"><use href="#i-download"/></svg><span data-t="menuExport">Simpan file</span></button>
        </div>
        <button class="btn" id="menuCredits"><svg class="ic"><use href="#i-star"/></svg><span data-t="menuCredits">Kredit</span></button>
      </div>
      <p class="menu-foot">v1.4 · Lav Studio</p>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hud">
    <div class="wallet">
      <div class="pill pill-coin" id="coinPill"><svg class="ic"><use href="#i-coin"/></svg><b id="coins">0</b></div>
      <div class="pill pill-pearl hidden" id="pearlPill"><svg class="ic"><use href="#i-pearl"/></svg><b id="pearls">0</b></div>
      <button class="pill pill-shell hidden" id="shellPill" aria-label="Kerang"><svg class="ic"><use href="#i-shell"/></svg><b id="shells">0</b></button>
    </div>
    <div class="sub" id="penRate"></div>
  </div>
  <div id="hudRight" class="hud-right">
    <button class="btn icon" id="menuBtn" aria-label="Menu"><svg class="ic"><use href="#i-home"/></svg></button>
    <button class="btn icon" id="trophyBtn" aria-label="Trofi"><svg class="ic"><use href="#i-trophy"/></svg><i class="badge hidden" id="trophyBadge"></i></button>
    <button class="btn icon" id="shopBtn" aria-label="Toko"><svg class="ic"><use href="#i-boat"/></svg><i class="badge hidden" id="shopBadge"></i></button>
    <button class="btn icon" id="bookBtn" aria-label="Buku ikan"><svg class="ic"><use href="#i-book"/></svg></button>
    <button class="btn icon" id="setBtn" aria-label="Pengaturan"><svg class="ic"><use href="#i-gear"/></svg></button>
  </div>
  <div id="castInfo" class="cast-info hidden">
    <div class="pill pill-dark"><svg class="ic"><use href="#i-fish"/></svg><b id="catchCount">0/2</b></div>
  </div>
  <div id="hint" class="hint hidden"></div>
  <div id="banner" class="banner hidden"></div>

  <!-- dock -->
  <div id="dock" class="dock">
    <button class="btn btn-tree" id="treeBtn"><svg class="ic"><use href="#i-tree"/></svg><span data-t="tree">Skill</span><i class="badge hidden" id="treeBadge">0</i></button>
    <button class="btn btn-auto hidden" id="autoBtn" aria-pressed="false"><svg class="ic"><use href="#i-robot"/></svg><span data-t="auto">Otomatis</span></button>
    <div class="dock-stats" id="dockStats"></div>
    <button class="btn btn-cast" id="castBtn"><svg class="ic"><use href="#i-hook"/></svg><span data-t="tapSea">Ketuk laut untuk melempar</span></button>
  </div>

  <!-- haul (results) -->
  <aside id="haul" class="sheet sheet-right" aria-hidden="true">
    <header class="sheet-head"><h2 data-t="haul">Tangkapan</h2><span class="muted" id="haulDepth"></span></header>
    <ul class="haul-list" id="haulList"></ul>
    <div class="haul-foot">
      <div class="haul-bonus" id="haulBonus"></div>
      <div class="haul-total"><span data-t="total">Total</span><b id="haulTotal"><svg class="ic"><use href="#i-coin"/></svg>0</b></div>
      <div class="row">
        <button class="btn btn-primary grow" id="haulTake"><span data-t="take">Ambil</span></button>
      </div>
    </div>
  </aside>

  <!-- skill tree -->
  <section id="tree" class="screen" aria-hidden="true">
    <div class="tree-view" id="treeView">
      <div class="tree-world" id="treeWorld"><svg class="tree-links" id="treeLinks"></svg></div>
    </div>
    <div class="tree-top">
      <div class="wallet">
        <div class="pill pill-coin"><svg class="ic"><use href="#i-coin"/></svg><b id="treeCoins">0</b></div>
        <div class="pill pill-pearl hidden" id="treePearlPill"><svg class="ic"><use href="#i-pearl"/></svg><b id="treePearls">0</b></div>
      </div>
      <div class="tree-tools">
        <button class="btn icon" id="zoomOut" aria-label="Perkecil"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button class="btn icon" id="zoomIn" aria-label="Perbesar"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button class="btn icon" id="treeClose" aria-label="Tutup"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <aside class="node-panel" id="nodePanel"></aside>
  </section>

  <!-- fishdex -->
  <section id="book" class="screen screen-paper" aria-hidden="true">
    <nav class="book-rail" id="bookRail"></nav>
    <div class="book-main">
      <header class="book-head">
        <div><h2 id="bookTitle"></h2><p class="muted" id="bookSub"></p></div>
        <button class="btn icon" id="bookClose" aria-label="Tutup"><svg class="ic"><use href="#i-close"/></svg></button>
      </header>
      <div class="book-grid" id="bookGrid"></div>
      <p class="book-hint muted" id="bookHint"></p>
    </div>
  </section>

  <!-- settings -->
  <aside id="settings" class="sheet sheet-right" aria-hidden="true">
    <header class="sheet-head"><h2 data-t="settings">Pengaturan</h2><button class="btn icon" id="setClose" aria-label="Tutup"><svg class="ic"><use href="#i-close"/></svg></button></header>
    <div class="set-list" id="setList"></div>
  </aside>

  <!-- welcome back / confirm -->
  <aside id="modal" class="sheet sheet-left" aria-hidden="true"></aside>
  <div id="toasts" class="toasts"></div>
  <div id="scrim" class="scrim"></div>

  <script src="js/data.js"></script>
  <script src="js/atlas.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/trophies.js"></script>
  <script src="js/global.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
